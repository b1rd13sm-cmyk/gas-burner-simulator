<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ガスバーナー操作シミュレーション</title>
  <meta name="description" content="元栓、コック、マッチ、ガス調節ねじ、空気調節ねじを実際の手順で操作できる中学理科向けシミュレーション">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101825'/%3E%3Cpath d='M32 8c4 11 15 18 15 31a15 15 0 1 1-30 0c0-8 5-15 10-21 0 10 5 12 5 12 3-7 2-14 0-22Z' fill='%2339a7ff'/%3E%3Cpath d='M32 31c4 6 7 10 7 15a7 7 0 0 1-14 0c0-5 3-9 7-15Z' fill='%23dff7ff'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#152334;--muted:#5d6a78;--paper:#f4f7fa;--panel:#fff;--blue:#1376d2;--cyan:#43bfe8;--red:#e14b45;--yellow:#f6b83f;--green:#2e9c71;--line:#d9e2ea;--shadow:0 16px 45px rgba(30,54,76,.12)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif}
    body{min-height:100vh;overflow-x:hidden}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
    header{height:64px;padding:0 24px;background:#101825;color:white;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 3px 20px #0003;z-index:20}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#174b75,#121923);display:grid;place-items:center;font-size:20px}
    h1{font-size:1.05rem;margin:0;letter-spacing:.03em;white-space:nowrap}
    .head-actions{display:flex;gap:10px}
    .topbtn{border:1px solid #ffffff35;background:#ffffff12;color:#fff;border-radius:9px;padding:8px 13px;font-weight:700}
    .topbtn:hover{background:#ffffff20}
    main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;padding:18px;max-width:1500px;width:100%;margin:auto}
    .lab{position:relative;min-height:700px;background:linear-gradient(#e9f1f7 0 64%,#b8c5cc 64% 66%,#8c9aa2 66%);border:1px solid #ccd8e1;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;touch-action:none;user-select:none}
    .lab::before{content:"";position:absolute;left:0;right:0;top:64%;height:2px;background:#eef4f7}
    .board-note{position:absolute;top:18px;left:20px;color:#496170;font-weight:800;letter-spacing:.05em;font-size:.9rem;display:flex;align-items:center;gap:8px}
    .board-note::before{content:"";width:8px;height:8px;border-radius:50%;background:#2e9c71}
    .gas-model{position:absolute;top:18px;right:20px;display:flex;align-items:center;gap:9px;background:#fff9;border:1px solid #cbd9e3;padding:8px 11px;border-radius:12px;backdrop-filter:blur(8px);z-index:7}
    .gas-model span{font-size:.82rem;font-weight:800;color:#435564}
    .switch{position:relative;width:45px;height:25px;border:0;border-radius:99px;background:#9daab4;padding:0;transition:.2s}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0004;transition:.2s}
    .switch.on{background:#2389d6}.switch.on::after{left:23px}
    .apparatus{position:absolute;inset:70px 0 0}
    .bench-label{position:absolute;bottom:12px;left:20px;color:#fff9;font-weight:800;font-size:.8rem;letter-spacing:.1em}
    .burner{position:absolute;left:52%;bottom:58px;width:240px;height:485px;transform:translateX(-50%)}
    .flame-wrap{position:absolute;left:50%;bottom:350px;width:150px;height:240px;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 13px var(--glow,#48aaff));opacity:0;transition:opacity .18s}
    .flame-wrap.lit{opacity:1}
    .flame{position:absolute;left:50%;bottom:0;width:calc(38px + var(--gas)*28px);height:calc(68px + var(--gas)*125px);transform:translateX(-50%);transform-origin:50% 100%;animation:flicker .11s infinite alternate ease-in-out}
    .flame-outer,.flame-inner{position:absolute;inset:0;border-radius:55% 55% 46% 46% / 75% 75% 30% 30%;clip-path:polygon(50% 0,78% 40%,100% 100%,0 100%,22% 40%);background:var(--outer);opacity:.95}
    .flame-inner{inset:auto 24% 0;height:62%;background:var(--inner);opacity:.9}
    @keyframes flicker{from{transform:translateX(-50%) scaleX(.96) skewX(-1deg)}to{transform:translateX(-50%) scaleX(1.04) skewX(1deg)}}
    .barrel{position:absolute;left:88px;bottom:130px;width:64px;height:220px;background:linear-gradient(90deg,#687681,#d8e0e4 27%,#f8fbfc 48%,#9aa6ad 73%,#53616b);border:2px solid #54616b;border-radius:7px 7px 12px 12px;box-shadow:5px 8px 12px #23313c33}
    .barrel-top{position:absolute;left:84px;bottom:340px;width:72px;height:18px;border-radius:50%;background:radial-gradient(ellipse,#1a252d 0 28%,#7f8b93 31% 55%,#d7e0e5 59% 70%,#57646d 74%);z-index:4}
    .collar{position:absolute;left:76px;bottom:168px;width:88px;height:54px;border-radius:8px;background:linear-gradient(90deg,#4e5960,#c7d0d4 35%,#f0f4f5 54%,#717d84);border:2px solid #4e5a62;box-shadow:0 6px 10px #0002}
    .air-hole{position:absolute;left:93px;bottom:184px;width:18px;height:13px;background:#16232d;border-radius:50%;box-shadow:38px 0 #16232d;z-index:3;opacity:calc(.1 + var(--air)*.9)}
    .base{position:absolute;left:29px;bottom:35px;width:182px;height:46px;border-radius:50%;background:linear-gradient(#9ca9b1,#4b5963);border:2px solid #46525b;box-shadow:0 13px 15px #1f2b3455}
    .stem{position:absolute;left:96px;bottom:68px;width:48px;height:103px;background:linear-gradient(90deg,#59666f,#d7dfe3,#6f7c84);border:2px solid #505d65}
    .screw{position:absolute;left:157px;width:66px;height:66px;border:0;border-radius:50%;background:transparent;z-index:7;touch-action:none;cursor:grab;overflow:visible;padding:0}
    .screw:active{cursor:grabbing}
    .cap-face{position:absolute;inset:3px;border-radius:50%;background:repeating-conic-gradient(#536169 0deg 8deg,#c8d1d5 8deg 15deg,#758189 15deg 22deg);border:3px solid #46535b;box-shadow:inset 0 0 0 8px #929ea5,inset 0 0 0 11px #dbe2e5,0 6px 12px #0005;transform:rotate(var(--turn,0deg));transition:transform .07s linear}
    .cap-face::before{content:"";position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#f5f8f9,#aab5ba 48%,#59666e 100%);border:2px solid #4a565e}
    .cap-face::after{content:"";position:absolute;left:50%;top:7px;width:5px;height:18px;border-radius:4px;background:#126da9;box-shadow:0 1px 2px #fff8;transform:translateX(-50%)}
    .screw-label{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:96px;padding:5px 7px;border-radius:7px;background:#172532ed;color:#fff;font-size:.69rem;font-weight:900;white-space:nowrap;pointer-events:none;box-shadow:0 3px 8px #0003}
    .gas-screw{bottom:72px}.air-screw{bottom:164px}
    .screw:focus-visible,.valve:focus-visible,.match:focus-visible{outline:4px solid #46a7ff;outline-offset:4px}
    .hose{position:absolute;left:calc(52% + 92px);right:81px;bottom:91px;height:149px;border:18px solid #c95149;border-left:0;border-top:0;border-radius:0 0 120px 0;pointer-events:none}
    .hose::after{content:"";position:absolute;right:-18px;top:-11px;width:47px;height:22px;border-radius:11px;background:#9e3c38;box-shadow:inset 0 3px #d66a63}
    .tap-unit{position:absolute;right:34px;bottom:178px;width:190px;height:215px}
    .pipe{position:absolute;right:58px;top:0;width:28px;height:148px;background:linear-gradient(90deg,#8b989f,#edf1f2,#7c8a92);border:2px solid #68747b;border-radius:8px}
    .nozzle{position:absolute;right:0;bottom:45px;width:94px;height:34px;background:linear-gradient(#d8e0e3,#75828a);border:2px solid #68747b;border-radius:5px 18px 18px 5px}
    .valve{position:absolute;border:0;color:#fff;font-weight:900;box-shadow:0 5px 10px #0004;z-index:5}
    .main-valve{right:29px;top:24px;width:88px;height:42px;border-radius:9px;background:#3a4650;transform:rotate(var(--main-rot,0deg));transition:transform .25s}
    .cock-unit{position:absolute;left:calc(52% + 82px);bottom:80px;width:116px;height:70px;z-index:8}
    .cock-body{position:absolute;left:0;top:25px;width:94px;height:28px;border-radius:7px;background:linear-gradient(#c8d1d5,#66747c);border:2px solid #5d6970;box-shadow:0 4px 8px #0003}
    .cock{left:36px;top:0;width:72px;height:27px;border-radius:14px;background:#43515a;transform:rotate(var(--cock-rot,90deg));transition:transform .25s;transform-origin:14px 50%}
    .cock::before{content:"";position:absolute;left:7px;top:6px;width:58px;height:15px;border-radius:8px;background:linear-gradient(#77848b,#303c44)}
    .valve-tag{position:absolute;right:0;width:145px;text-align:center;font-size:.75rem;font-weight:800;color:#425563;background:#fffbd;border-radius:8px;padding:5px;border:1px solid #ccd9e2}
    .main-tag{top:-12px;right:122px}.cock-tag{left:95px;top:23px;right:auto;width:92px}
    .gas-flow{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;opacity:0;transition:.25s;z-index:1}
    .gas-flow.show{opacity:1}
    .gas-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#38a7e8;box-shadow:0 0 8px #38a7e8;animation:flow 1.6s linear infinite}
    .gas-dot:nth-child(2){animation-delay:-.5s}.gas-dot:nth-child(3){animation-delay:-1s}
    @keyframes flow{0%{right:99px;bottom:260px}28%{right:99px;bottom:165px}52%{right:220px;bottom:94px}75%{right:410px;bottom:94px}100%{right:48%;bottom:235px}}
    .matchbox{position:absolute;left:25px;bottom:45px;width:150px;height:100px;background:#d13d32;border-radius:8px;box-shadow:0 9px 15px #0004;border:3px solid #f6d4a2;display:grid;place-items:center;color:white;font-weight:900;letter-spacing:.1em}
    .matchbox::after{content:"";position:absolute;left:-7px;right:-7px;bottom:-12px;height:21px;border-radius:5px;background:repeating-linear-gradient(90deg,#5c3327 0 3px,#d59a68 3px 6px);border:2px solid #4f2c23}
    .matchbox small{display:block;font-size:.65rem;letter-spacing:.03em;text-align:center;margin-top:4px}
    .match{position:absolute;left:191px;bottom:86px;width:150px;height:44px;border:0;background:transparent;z-index:12;touch-action:none;cursor:grab;transform-origin:18px 22px}
    .match:active{cursor:grabbing}
    .stick{position:absolute;left:12px;top:19px;width:126px;height:7px;border-radius:5px;background:linear-gradient(#f4cb82,#bd7b34);box-shadow:0 2px 3px #0003}
    .head{position:absolute;left:2px;top:14px;width:22px;height:17px;border-radius:50%;background:#582a24;box-shadow:0 0 4px #0006}
    .match-fire{position:absolute;left:-6px;top:-19px;width:35px;height:38px;opacity:0;filter:drop-shadow(0 0 9px #ff8b1f);transition:.15s;animation:mflicker .13s infinite alternate}
    .match-fire::before{content:"";position:absolute;inset:0;background:linear-gradient(#ffe66e,#ff8e18 60%,#f03719);clip-path:polygon(50% 0,83% 50%,100% 100%,0 100%,17% 50%);border-radius:50%}
    .match.burning .match-fire{opacity:1}
    @keyframes mflicker{to{transform:scale(.92) skewX(4deg)}}
    .near-ring{position:absolute;left:calc(52% - 52px);bottom:382px;width:104px;height:104px;border:2px dashed #3d9bd3;border-radius:50%;opacity:.2;pointer-events:none}
    .status-pill{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:9px 15px;border-radius:99px;background:#172532e8;color:#fff;font-weight:800;font-size:.86rem;z-index:8;box-shadow:0 5px 15px #0003;white-space:nowrap}
    .status-pill.warn{background:#a74035}.status-pill.ok{background:#237758}
    aside{display:flex;flex-direction:column;gap:14px;min-width:0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px rgba(30,54,76,.08);padding:17px}
    .card h2{font-size:1rem;margin:0 0 13px;display:flex;align-items:center;justify-content:space-between}
    .stepnum{font-size:.72rem;color:#fff;background:#1f3345;padding:4px 8px;border-radius:99px}
    .route{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .mini{border:1px solid #d7e1e8;background:#f7fafc;border-radius:10px;padding:9px 10px;text-align:left;color:#394b59;font-size:.78rem;font-weight:800}
    .mini.open{border-color:#63aee3;background:#eaf6ff;color:#0b5e9f}
    .mini.done{border-color:#6ec7a2;background:#e9f8f1;color:#247555}
    .control-group{margin:14px 0 0}
    .control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.83rem;font-weight:900}
    .value{font-variant-numeric:tabular-nums;color:#1469ad}
    input[type=range]{width:100%;accent-color:#1479cf;height:26px}
    .scale{display:flex;justify-content:space-between;color:#75818b;font-size:.67rem;margin-top:-3px}
    .meters{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .meter{background:#f3f7fa;border-radius:11px;padding:11px;border:1px solid #dee7ed}
    .meter span{font-size:.7rem;color:#657480;font-weight:800;display:block}
    .meter strong{font-size:1rem;display:block;margin-top:3px}
    .message{min-height:76px;border-left:5px solid #2587ca;background:#edf7fd;border-radius:8px;padding:11px 12px;color:#274252;font-size:.83rem;line-height:1.55}
    .message.warn{border-color:#df5e4f;background:#fff0ed;color:#743129}
    .message.success{border-color:#2e9c71;background:#ebf8f1;color:#226249}
    .reset{width:100%;border:1px solid #d4dde4;background:#fff;border-radius:10px;padding:10px;font-weight:900;color:#43515d}
    .help{font-size:.78rem;line-height:1.55;color:#65717c;margin:0}
    .kbd{display:inline-block;border:1px solid #cbd4db;border-bottom-width:3px;border-radius:5px;padding:0 5px;background:#fff;color:#384956;font-size:.68rem}
    .toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,120px);background:#182632;color:#fff;border-radius:12px;padding:12px 18px;font-weight:800;box-shadow:0 10px 35px #0005;z-index:50;transition:.25s}
    .toast.show{transform:translate(-50%,0)}
    .mistake{position:fixed;inset:0;background:#40100cc7;display:grid;place-items:center;z-index:70;opacity:0;pointer-events:none;transition:opacity .18s;backdrop-filter:blur(3px)}
    .mistake.show{opacity:1}
    .mistake-box{min-width:min(430px,86vw);padding:27px 30px;border:3px solid #ffb1a8;border-radius:20px;background:#fff;color:#9d241c;text-align:center;box-shadow:0 20px 70px #0008;transform:scale(.86);transition:transform .18s}
    .mistake.show .mistake-box{transform:scale(1)}
    .mistake-title{font-size:2.6rem;line-height:1;font-weight:1000;letter-spacing:.08em}
    .mistake-reason{margin-top:12px;font-size:1rem;font-weight:850;color:#562923}
    @media(max-width:1050px){main{grid-template-columns:1fr}.lab{min-height:670px}aside{display:grid;grid-template-columns:1fr 1fr}.card:last-child{grid-column:1/-1}}
    @media(max-width:680px){header{padding:0 13px;height:58px}h1{font-size:.86rem}.topbtn{padding:7px 9px;font-size:.75rem}main{padding:9px;gap:9px}.lab{min-height:620px;border-radius:12px}.apparatus{transform:scale(.75);transform-origin:50% 100%;width:133.333%;left:-16.666%}.status-pill{top:55px;font-size:.72rem}.gas-model{top:12px;right:12px}.board-note{top:15px;left:12px;font-size:.74rem}.burner{left:48%}.hose{left:calc(48% + 92px);right:57px}.near-ring{left:calc(48% - 52px)}aside{display:flex}.card{padding:14px}.matchbox{left:12px}.match{left:164px}.tap-unit{right:10px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark">🔥</div><h1>ガスバーナー操作シミュレーション</h1></div>
    <div class="head-actions"><button class="topbtn" id="guideBtn">手順ガイド ON</button><button class="topbtn" id="resetTop">最初から</button></div>
  </header>
  <main>
    <section class="lab" id="lab" aria-label="ガスバーナー実験台">
      <div class="board-note">実験台｜点火と炎の調節</div>
      <div class="gas-model"><span>ガスを色で表示</span><button class="switch on" id="gasVisible" role="switch" aria-checked="true" aria-label="ガスを色で表示"></button></div>
      <div class="status-pill" id="statusPill">元栓を開けよう</div>
      <div class="apparatus" id="apparatus">
        <div class="gas-flow" id="gasFlow" aria-hidden="true"><i class="gas-dot"></i><i class="gas-dot"></i><i class="gas-dot"></i></div>
        <div class="near-ring"></div>
        <div class="tap-unit">
          <div class="pipe"></div><div class="nozzle"></div>
          <button class="valve main-valve" id="mainValve" style="--main-rot:0deg" aria-pressed="false">元栓</button>
          <div class="valve-tag main-tag">元栓：<b id="mainState">閉</b></div>
        </div>
        <div class="hose"></div>
        <div class="cock-unit">
          <div class="cock-body"></div>
          <button class="valve cock" id="cock" style="--cock-rot:90deg" aria-pressed="false" aria-label="ガス管とガスバーナーの間のコック"></button>
          <div class="valve-tag cock-tag">コック：<b id="cockState">閉</b></div>
        </div>
        <div class="burner" id="burner">
          <div class="flame-wrap" id="flameWrap"><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div></div>
          <div class="barrel"></div><div class="barrel-top" id="burnerMouth"></div><div class="air-hole"></div><div class="collar"></div>
          <div class="stem"></div><div class="base"></div>
          <button class="screw gas-screw" id="gasScrew" style="--turn:0deg" aria-label="ガス調節ねじ。ペットボトルのキャップのようにドラッグして回します"><span class="cap-face"></span><span class="screw-label">ガス調節ねじ ↻</span></button>
          <button class="screw air-screw" id="airScrew" style="--turn:0deg" aria-label="空気調節ねじ。ペットボトルのキャップのようにドラッグして回します"><span class="cap-face"></span><span class="screw-label">空気調節ねじ ↻</span></button>
        </div>
        <div class="matchbox" id="matchbox">MATCH<small>下の茶色い部分でこする</small></div>
        <button class="match" id="match" aria-label="マッチ。ドラッグして動かす"><span class="match-fire"></span><span class="stick"></span><span class="head"></span></button>
        <div class="bench-label">SCIENCE LAB</div>
      </div>
    </section>
    <aside>
      <section class="card">
        <h2>点火の手順 <span class="stepnum" id="stepCount">0 / 5</span></h2>
        <div class="route">
          <button class="mini" id="step1">1　元栓を開く</button>
          <button class="mini" id="step2">2　コックを開く</button>
          <button class="mini" id="step3">3　マッチをこする</button>
          <button class="mini" id="step4">4　火を炎口へ</button>
          <button class="mini" id="step5">5　ガスねじを開く</button>
        </div>
      </section>
      <section class="card">
        <h2>炎を調節する</h2>
        <div class="control-group">
          <div class="control-head"><label for="gasRange">ガスの量</label><span class="value" id="gasValue">0%</span></div>
          <input id="gasRange" type="range" min="0" max="100" value="0" aria-label="ガスの量">
          <div class="scale"><span>小さい</span><span>炎の大きさ</span><span>大きい</span></div>
        </div>
        <div class="control-group">
          <div class="control-head"><label for="airRange">空気の量</label><span class="value" id="airValue">0%</span></div>
          <input id="airRange" type="range" min="0" max="100" value="0" aria-label="空気の量">
          <div class="scale"><span>黄〜橙色</span><span>炎の色</span><span>青色</span></div>
        </div>
        <div class="meters">
          <div class="meter"><span>炎の状態</span><strong id="flameType">消火</strong></div>
          <div class="meter"><span>燃焼音</span><strong id="soundType">なし</strong></div>
        </div>
      </section>
      <section class="card">
        <h2>先生からのヒント</h2>
        <div class="message" id="message">まずは元栓をクリックして開けよう。ガス調節ねじは、まだ閉じたままやで。</div>
      </section>
      <section class="card">
        <button class="reset" id="resetBtn">すべて元に戻す</button>
        <p class="help">マッチをドラッグし、マッチ箱下部の茶色い部分でこすると火がつきます。キーボードでは<span class="kbd">←</span><span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">→</span>でも移動できます。</p>
      </section>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="mistake" id="mistakeBanner" role="alert" aria-live="assertive"><div class="mistake-box"><div class="mistake-title">ミス！</div><div class="mistake-reason" id="mistakeReason"></div></div></div>
<script>
  (function(){
    "use strict";
    var state={main:false,cock:false,match:false,lit:false,gas:0,air:0,gasVisible:true,guide:true,matchX:0,matchY:0,completed:[false,false,false,false,false],hadLit:false,leakReported:false};
    var el={};
    ["lab","apparatus","mainValve","cock","mainState","cockState","gasVisible","gasFlow","match","matchbox","burnerMouth","flameWrap","gasRange","airRange","gasValue","airValue","flameType","soundType","message","statusPill","stepCount","guideBtn","toast","gasScrew","airScrew","mistakeBanner","mistakeReason"].forEach(function(id){el[id]=document.getElementById(id)});
    function gasPath(){return state.main&&state.cock}
    function gasEscaping(){return gasPath()&&state.gas>3&&!state.lit}
    function gasActive(){return gasPath()&&state.gas>3}
    function msg(text,type){el.message.textContent=text;el.message.className="message"+(type?" "+type:"")}
    var toastTimer;
    function toast(text){el.toast.textContent=text;el.toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.toast.classList.remove("show")},2100)}
    var mistakeTimer;
    function mistake(reason){
      el.mistakeReason.textContent=reason;
      el.mistakeBanner.classList.add("show");
      reset(true);
      clearTimeout(mistakeTimer);
      mistakeTimer=setTimeout(function(){el.mistakeBanner.classList.remove("show")},1900);
    }
    function flameColors(){
      var a=state.air;
      if(a<25)return {outer:"#ff8a16",inner:"#ffe75b",glow:"#ff9a23",type:"黄色い炎",sound:"静か"};
      if(a<58)return {outer:"#37aaff",inner:"#f4e965",glow:"#54aaff",type:"青と黄の炎",sound:"小さい"};
      if(a<88)return {outer:"#168ee6",inner:"#b9f4ff",glow:"#42bdf5",type:"青い炎",sound:"安定"};
      return {outer:"#408ee6",inner:"#d8f8ff",glow:"#5fc8ff",type:"強い青い炎",sound:"ゴーッ"};
    }
    function currentStep(){
      if(!state.main)return 0;
      if(!state.cock)return 1;
      if(!state.match)return 2;
      if(!state.completed[3])return 3;
      if(!state.lit)return 4;
      return 5;
    }
    function update(){
      el.mainState.textContent=state.main?"開":"閉";
      el.cockState.textContent=state.cock?"開":"閉";
      el.mainValve.style.setProperty("--main-rot",state.main?"90deg":"0deg");
      el.cock.style.setProperty("--cock-rot",state.cock?"0deg":"90deg");
      el.mainValve.setAttribute("aria-pressed",state.main);
      el.cock.setAttribute("aria-pressed",state.cock);
      el.gasVisible.classList.toggle("on",state.gasVisible);
      el.gasVisible.setAttribute("aria-checked",state.gasVisible);
      el.gasFlow.classList.toggle("show",state.gasVisible&&gasActive());
      el.match.classList.toggle("burning",state.match);
      el.gasValue.textContent=state.gas+"%";el.airValue.textContent=state.air+"%";
      el.gasRange.value=state.gas;el.airRange.value=state.air;
      el.gasScrew.style.setProperty("--turn",(-state.gas*5.4)+"deg");
      el.airScrew.style.setProperty("--turn",(-state.air*5.4)+"deg");
      document.documentElement.style.setProperty("--gas",(state.gas/100).toFixed(2));
      document.documentElement.style.setProperty("--air",(state.air/100).toFixed(2));
      var c=flameColors();
      document.documentElement.style.setProperty("--outer",c.outer);
      document.documentElement.style.setProperty("--inner",c.inner);
      document.documentElement.style.setProperty("--glow",c.glow);
      el.flameWrap.classList.toggle("lit",state.lit&&gasActive());
      el.flameType.textContent=state.lit?c.type:"消火";
      el.soundType.textContent=state.lit?c.sound:"なし";
      if(state.lit&&!gasActive()){state.lit=false;el.flameWrap.classList.remove("lit")}
      state.completed[0]=state.main;state.completed[1]=state.cock;state.completed[2]=state.match||state.completed[2];state.completed[4]=state.lit||state.completed[4];
      document.querySelectorAll(".mini").forEach(function(n,i){n.classList.toggle("done",state.completed[i]);n.classList.toggle("open",state.guide&&currentStep()===i)});
      el.stepCount.textContent=state.completed.filter(Boolean).length+" / 5";
      if(gasEscaping()){el.statusPill.textContent="⚠ ガスが出ています（未点火）";el.statusPill.className="status-pill warn"}
      else if(state.lit){el.statusPill.textContent="点火中｜空気とガスを調節";el.statusPill.className="status-pill ok"}
      else{var labels=["元栓を開けよう","コックを開けよう","マッチに火をつけよう","マッチを炎口へ近づけよう","ガスねじを少しずつ開こう","炎を調節しよう"];el.statusPill.textContent=labels[currentStep()];el.statusPill.className="status-pill"}
      contextualHint();
    }
    function contextualHint(){
      if(!state.guide){msg("自由操作モードです。安全な順番を考えて操作しよう。");return}
      if(!state.main){msg("まずは元栓をクリックして開けよう。ガス調節ねじは、まだ閉じたままやで。");return}
      if(!state.cock){msg("次にコックを開けよう。ホースへガスが通る準備ができます。");return}
      if(!state.match){msg("マッチをドラッグし、マッチ箱の下にある茶色い部分でこすって火をつけよう。");return}
      if(!state.completed[3]&&!state.lit){msg("火のついたマッチの先を、バーナーの炎口へ近づけたままにしよう。");return}
      if(!state.lit&&state.gas===0){msg("マッチを炎口の近くに置いたまま、ガス調節ねじを少しずつ開こう。");return}
      if(gasEscaping()){msg("ガスが出ていますが、マッチが炎口から遠いため点火していません。ガスねじを閉じてやり直そう。","warn");return}
      if(state.lit&&state.air<55){msg("点火できました。次は空気調節ねじをゆっくり開き、青い炎にしよう。","success");return}
      if(state.lit){msg("青い炎になりました。ガスの量で炎の大きさも調節できます。実験に適した炎をつくろう。","success")}
    }
    function toggleMain(){
      if(state.main&&(state.lit||state.cock)){
        return mistake(state.lit?"炎がついたまま元栓を閉めました。先にガス調節ねじを閉めよう。":"コックより先に元栓を閉めました。消火はガスねじ→コック→元栓の順です。");
      }
      state.main=!state.main;if(!state.main){state.cock=false;state.lit=false}update()
    }
    function toggleCock(){
      if(!state.main){return mistake("元栓より先にコックを操作しました。")}
      if(state.cock&&state.lit){return mistake("炎がついたままコックを閉めました。先にガス調節ねじを閉めよう。")}
      state.cock=!state.cock;if(!state.cock)state.lit=false;update()
    }
    el.mainValve.addEventListener("click",toggleMain);
    el.cock.addEventListener("click",toggleCock);
    el.gasVisible.addEventListener("click",function(){state.gasVisible=!state.gasVisible;update()});
    function setGas(v){
      var next=Math.max(0,Math.min(100,Math.round(v)));
      if(next>0&&!state.main){return mistake("元栓が閉じたままガス調節ねじを開けました。")}
      else if(next>0&&!state.cock){return mistake("コックが閉じたままガス調節ねじを開けました。")}
      else {
        state.gas=next;
        if(next>3&&!state.lit&&!(state.match&&nearMouth())&&!state.leakReported){
          state.leakReported=true;
          return mistake("ガスが漏れています！ 火のついたマッチを炎口に近づけてからガスを出そう。");
        }
      }
      if(state.gas===0)state.lit=false;
      if(state.gas===0)state.leakReported=false;
      update();checkIgnition();
    }
    function setAir(v){state.air=Math.max(0,Math.min(100,Math.round(v)));update()}
    el.gasRange.addEventListener("input",function(e){setGas(e.target.value)});
    el.airRange.addEventListener("input",function(e){setAir(e.target.value)});
    function makeRotary(node,getValue,setValue){
      var turning=false,lastAngle=0,totalAngle=0,startValue=0,moved=false;
      function pointerAngle(e){
        var r=node.getBoundingClientRect();
        return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
      }
      node.addEventListener("pointerdown",function(e){
        turning=true;moved=false;lastAngle=pointerAngle(e);totalAngle=0;startValue=getValue();
        node.setPointerCapture(e.pointerId);e.preventDefault();
      });
      node.addEventListener("pointermove",function(e){
        if(!turning)return;
        var angle=pointerAngle(e),delta=angle-lastAngle;
        if(delta>180)delta-=360;
        if(delta<-180)delta+=360;
        totalAngle+=delta;lastAngle=angle;
        if(Math.abs(totalAngle)>3)moved=true;
        setValue(startValue-totalAngle/5.4);
      });
      node.addEventListener("pointerup",function(e){
        turning=false;try{node.releasePointerCapture(e.pointerId)}catch(_e){}
        if(!moved)setValue(getValue()+10>100?0:getValue()+10);
      });
      node.addEventListener("keydown",function(e){
        if(e.key==="ArrowRight"||e.key==="ArrowUp"){e.preventDefault();setValue(getValue()+5)}
        if(e.key==="ArrowLeft"||e.key==="ArrowDown"){e.preventDefault();setValue(getValue()-5)}
      });
    }
    makeRotary(el.gasScrew,function(){return state.gas},setGas);
    makeRotary(el.airScrew,function(){return state.air},setAir);
    function matchHeadPoint(){
      var r=el.match.getBoundingClientRect();
      return {x:r.left+12,y:r.top+22};
    }
    function mouthPoint(){
      var r=el.burnerMouth.getBoundingClientRect();
      return {x:r.left+r.width/2,y:r.top+r.height/2};
    }
    function nearMouth(){
      var a=matchHeadPoint(),b=mouthPoint(),dx=a.x-b.x,dy=a.y-b.y;
      return Math.sqrt(dx*dx+dy*dy)<72;
    }
    function checkIgnition(){
      if(state.match&&nearMouth()){state.completed[3]=true}
      if(state.match&&nearMouth()&&gasActive()&&state.gas>=5){
        if(!state.lit){state.lit=true;state.hadLit=true;state.leakReported=false;state.completed[4]=true;toast("点火しました！")}
        state.match=false;update();
      }
    }
    var dragging=false,start={x:0,y:0,mx:0,my:0},lastPointer={x:0,y:0},strikeDistance=0;
    function overStriker(){
      var head=matchHeadPoint(),box=el.matchbox.getBoundingClientRect();
      return head.x>box.left-12&&head.x<box.right+12&&head.y>box.bottom-10&&head.y<box.bottom+24;
    }
    function tryStrike(e){
      if(state.match||!overStriker())return;
      strikeDistance+=Math.hypot(e.clientX-lastPointer.x,e.clientY-lastPointer.y);
      if(strikeDistance>=34){
        if(!state.main||!state.cock){return mistake("元栓とコックを開ける前にマッチをつけました。")}
        state.match=true;state.completed[2]=true;toast("シュッ！ マッチに火がつきました");update();
      }
    }
    el.match.addEventListener("pointerdown",function(e){
      dragging=true;strikeDistance=0;lastPointer={x:e.clientX,y:e.clientY};
      el.match.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY,mx:state.matchX,my:state.matchY};e.preventDefault()
    });
    el.match.addEventListener("pointermove",function(e){
      if(!dragging)return;
      state.matchX=start.mx+(e.clientX-start.x);state.matchY=start.my+(e.clientY-start.y);
      el.match.style.transform="translate("+state.matchX+"px,"+state.matchY+"px)";
      tryStrike(e);lastPointer={x:e.clientX,y:e.clientY};
      checkIgnition();
    });
    el.match.addEventListener("pointerup",function(e){dragging=false;try{el.match.releasePointerCapture(e.pointerId)}catch(_e){}checkIgnition();update()});
    el.match.addEventListener("keydown",function(e){
      var d=e.shiftKey?20:7,used=true;
      if(e.key==="ArrowLeft")state.matchX-=d;else if(e.key==="ArrowRight")state.matchX+=d;else if(e.key==="ArrowUp")state.matchY-=d;else if(e.key==="ArrowDown")state.matchY+=d;else used=false;
      if(used){e.preventDefault();el.match.style.transform="translate("+state.matchX+"px,"+state.matchY+"px)";checkIgnition()}
    });
    function reset(silent){
      state={main:false,cock:false,match:false,lit:false,gas:0,air:0,gasVisible:true,guide:state.guide,matchX:0,matchY:0,completed:[false,false,false,false,false],hadLit:false,leakReported:false};
      dragging=false;strikeDistance=0;el.match.style.transform="translate(0,0)";update();if(silent!==true)toast("最初の状態に戻しました");
    }
    document.getElementById("resetBtn").addEventListener("click",reset);
    document.getElementById("resetTop").addEventListener("click",reset);
    el.guideBtn.addEventListener("click",function(){state.guide=!state.guide;el.guideBtn.textContent="手順ガイド "+(state.guide?"ON":"OFF");update()});
    document.querySelectorAll(".mini").forEach(function(n,i){
      n.addEventListener("click",function(){var hints=["右側の元栓をクリック","ガス管とバーナーの間のコックをクリック","マッチ箱下の茶色い部分でマッチをこする","火のついたマッチを炎口へドラッグ","マッチを炎口の近くに置いてガス量を上げる"];toast(hints[i])});
    });
    setInterval(function(){if(state.match&&Math.random()<.035){state.match=false;toast("マッチの火が消えました");update()}},1000);
    window.addEventListener("resize",checkIgnition);
    var context=document.modelContext;
    if(context&&context.registerTool){
      var life=new AbortController();
      Promise.resolve(context.registerTool({
        name:"set_burner_controls",title:"バーナー操作を設定",
        description:"元栓、コック、ガス量、空気量を設定し、画面のシミュレーション状態を更新します。",
        inputSchema:{type:"object",properties:{mainValve:{type:"boolean"},cock:{type:"boolean"},gas:{type:"number",minimum:0,maximum:100},air:{type:"number",minimum:0,maximum:100}},additionalProperties:false},
        annotations:{readOnlyHint:false,untrustedContentHint:false},
        execute:function(input){
          if(!input||typeof input!=="object")throw new Error("設定値が必要です");
          if(typeof input.mainValve==="boolean")state.main=input.mainValve;
          if(typeof input.cock==="boolean")state.cock=input.cock&&state.main;
          if(typeof input.gas==="number")state.gas=state.main&&state.cock?Math.max(0,Math.min(100,Math.round(input.gas))):0;
          if(typeof input.air==="number")state.air=Math.max(0,Math.min(100,Math.round(input.air)));
          if(!gasActive())state.lit=false;update();
          return {mainValve:state.main,cock:state.cock,gas:state.gas,air:state.air,lit:state.lit};
        }
      },{signal:life.signal})).catch(function(){});
    }
    update();
  })();
</script>
</body>
</html>
